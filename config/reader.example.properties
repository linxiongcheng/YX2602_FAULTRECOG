# UTF-8。复制为 local.properties；${NAME} 从提交进程环境变量读取。
kafka.bootstrap.servers=bigdata-kafka1:9092,bigdata-kafka2:9092,bigdata-kafka01:9092,bigdata-kafka02:9092,bigdata-kafka03:9092,bigdata-datanode12:9092
kafka.input.topic=heartbeat3
kafka.error.topic=errors-heartbeat3
kafka.group.id=heartbeat-reader
checkpoint.storage=hdfs:///flink/checkpoints/heartbeat3-reader
job.name=yx2602-heartbeat-reader
parallelism=2
validation.max.future.skew.ms=60000
# 解析阶段允许的最大消息年龄；恰好10分钟仍允许，超过则过滤并计数。
parser.max.age.ms=600000
# 首次部署后保持不变，保障keyed state的保存点恢复和扩缩容兼容。
parser.max.parallelism=128
checkpoint.interval.ms=30000
checkpoint.timeout.ms=180000
kafka.delivery.timeout.ms=120000
restart.attempts=10
restart.delay.ms=10000
kafka.error.max.request.bytes=8388608
# --run / --check-ignite 必填：Ignite 2.18.0 thin-client端口（不是discovery端口）。
# ignite.addresses=实际Ignite主机名:10800
# ignite.username=${HEARTBEAT_IGNITE_USER}
# ignite.password=${HEARTBEAT_IGNITE_PASSWORD}
ignite.ssl.enabled=false
ignite.request.timeout.ms=10000
ignite.transaction.timeout.ms=10000
# 包含首次尝试；失败重试整个事务，重复时间戳不会再次占用历史槽位。
ignite.retry.attempts=3
ignite.retry.delay.ms=1000
ignite.batch.size=128
ignite.queue.capacity=1024
ignite.batch.linger.ms=200
ignite.flush.timeout.ms=60000
# 仅用于连接、安全配置，读取端和异常写入端共享，不允许覆盖可靠性参数。
# kafka.client.security.protocol=SASL_SSL
# kafka.client.sasl.mechanism=PLAIN
# kafka.client.sasl.jaas.config=${HEARTBEAT_KAFKA_JAAS}
# kafka.client.ssl.truststore.location=/path/visible/on/all/nodes/truststore.jks
# kafka.client.ssl.truststore.password=${HEARTBEAT_KAFKA_TRUSTSTORE_PASSWORD}
