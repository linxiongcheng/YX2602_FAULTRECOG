# UTF-8 配置文件；${NAME} 表示从环境变量读取。
# 每阶段、每子任务的性能摘要日志间隔；0关闭，最小1000，最大3600000。修改后重新提交。
monitor.log.interval.ms=30000

# Kafka Broker 地址，多个地址用逗号分隔。
kafka.bootstrap.servers=bigdata-kafka1:9092,bigdata-kafka2:9092,bigdata-kafka01:9092,bigdata-kafka02:9092,bigdata-kafka03:9092

# 读取原始心跳消息的 Topic。
kafka.input.topic=heartbeat3

# 存放异常消息的 Topic。
kafka.error.topic=errors-heartbeat3

# Kafka 消费组名称，用于保存和恢复消费进度。
kafka.group.id=heartbeat3-reader

# 检查点存储路径，用于故障恢复。
checkpoint.storage=hdfs:///flink/checkpoints/heartbeat3-reader

# Flink 作业显示名称。
job.name=yx2602-heartbeat-reader

# Flink 作业并行度。
parallelism=3

# 发送时间允许超前平台时间的最大值，单位毫秒。
validation.max.future.skew.ms=60000

# 检查点触发间隔，单位毫秒。
checkpoint.interval.ms=30000

# 检查点超时时间，单位毫秒。
checkpoint.timeout.ms=180000

# 异常消息发送及重试的超时时间，单位毫秒。
kafka.delivery.timeout.ms=120000

# 任务失败后的最大自动重启次数。
restart.attempts=5

# 任务重启等待时间，单位毫秒。
restart.delay.ms=10000

# 异常消息生产者的最大请求大小，单位字节。
kafka.error.max.request.bytes=8388608

# 可选：Kafka 连接安全协议。
# kafka.client.security.protocol=SASL_SSL

# 可选：SASL 身份认证机制。
# kafka.client.sasl.mechanism=PLAIN

# 可选：JAAS 登录模块及凭据配置。
# kafka.client.sasl.jaas.config=${HEARTBEAT_KAFKA_JAAS}

# 可选：验证 Kafka 服务端证书的信任库路径。
# kafka.client.ssl.truststore.location=/path/visible/on/all/nodes/truststore.jks

# 可选：TLS 信任库密码。

# 每台电梯的历史保留条数。
max.records=10

# 共享历史配置文件路径；当前代码中配置此项会启用动态文件读取。
# 若仅需冷启动时读取max.records，请将下一行注释或留空。
ignite.history.config.path=hdfs:///flink/projectConfig/faultRecog/heartbeat-history.properties
ignite.history.refresh.interval.ms=10000


# 正式入库（--run）及数据库预检（--check-ignite）必填：Ignite thin-client地址。
# 格式为host:port，多个地址用英文逗号分隔；常用端口为10800。
ignite.addresses=10.98.254.31:10800
ignite.ssl.enabled=false
# 仅在Ignite服务开启认证时填写，两项必须同时填写；未开启认证时保持空白。
ignite.username=
ignite.password=
